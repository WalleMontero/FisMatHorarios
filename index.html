<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://fonts.googleapis.com/css?family=Montserrat" rel="stylesheet" />
    <title>Visualizador de horarios</title>
    <link rel="stylesheet" href="assets/style.css" />
  </head>
  <body>
    <div id="menuBackdrop" class="menu-backdrop"></div>
    <div class="container">
      <aside id="subjectMenu" aria-label="Materias">

        <div class="menu-header">
          <div>
            <h3>Materias</h3>
            <p class="subtle">Selecciona secciones para ver el horario</p>
          </div>
          <div class="chip-block" title="Secciones seleccionadas">
            <div class="chip" id="selectedCount">0</div>
            <span>sel.</span>
          </div>
        </div>

        <div class="controls">
          <div class="search-wrapper">
            <span class="search-icon">🔎</span>
            <input
              type="search"
              id="searcher"
              placeholder="Buscar (nombre, clave, área)..."
              autocomplete="off"
            />
          </div>

        </div>

        <div class="selected-panel">
          <div class="selected-title">Seleccionadas</div>
          <div id="selectedList" class="selected-list"></div>
        </div>

        <div id="subjectList" class="subject-list"></div>
        <div id="emptyState" class="empty-state" hidden>No hay resultados.</div>
        <div id="loadingState" class="empty-state">Cargando materias…</div>
      </aside>
        <div class="calendar-card">
          <div id="calendar"></div>
          
          <div id="calendarEmpty" class="calendar-empty" hidden>
            Selecciona secciones para ver el horario.
          </div>
        </div>
      </main>
    </div>

    <script src="assets/app.js"></script>
  </body>
</html>
